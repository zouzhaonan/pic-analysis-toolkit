[package]
name = "pic-aggregate"
version = "1.0.0"
edition = "2021"
description = "PIC aggregate: per-sample metagene profile from bigWig over gene bins (bigWigAverageOverBed-compatible)"
publish = false

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
